name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # The fetcher only needs requests; streamlit and google-genai are not
      # imported by the tests, so they are left out to keep CI fast.
      - name: Install dependencies
        run: pip install requests pytest ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Run tests
        run: python -m pytest -q
